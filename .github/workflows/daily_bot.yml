name: Daily BCS Vocabulary Telegram Bot

on:
  schedule:
    - cron: '0 9 * * *'   # 3 PM Dhaka
  workflow_dispatch:

permissions:
  contents: write   # ⬅️ this is NEW – allows the bot to save history

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Daily Job
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_ACTIONS: true
        run: python main.py

      - name: Commit and push changes (database + dashboard)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ || echo "No data folder"
          git commit -m "Update database and dashboard [skip ci]" || echo "No changes to commit"
          git push
